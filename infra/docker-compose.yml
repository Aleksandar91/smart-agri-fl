# PV-19 protocol: five CPU Docker clients, Flower 1.32.1.
# Scored jobs used 128 px, batch 16, ten rounds, frozen features.
# Point DATASET_DIR at a local PlantVillage raw/color tree.

services:
  flower-server:
    profiles: ["fl5"]
    build:
      context: ../fl-server
    command: ["python", "-m", "app.fl_server"]
    ports:
      - "9091:9091"
    environment:
      FL_LISTEN_ADDRESS: "0.0.0.0:9091"
      FL_NUM_ROUNDS: "${FL_NUM_ROUNDS:-10}"
      FL_MIN_CLIENTS: "${FL_MIN_CLIENTS:-5}"
      FL_OUTPUT_DIR: "/models/global"
      FL_EXPERIMENT_ID: "${FL_EXPERIMENT_ID:-pv19}"
      FL_AGGREGATION: "${FL_AGGREGATION:-fedavg}"
      FL_TRIM_BETA: "${FL_TRIM_BETA:-0.25}"
      FL_KRUM_MALICIOUS_CLIENTS: "${FL_KRUM_MALICIOUS_CLIENTS:-1}"
      FL_KRUM_CLIENTS_TO_KEEP: "${FL_KRUM_CLIENTS_TO_KEEP:-0}"
    volumes:
      - "${MODELS_DIR:-./fl-models}:/models/global"

  fl-client-0:
    profiles: ["fl5"]
    build:
      context: ../fl-client
    command: ["python", "-m", "app.fl_client"]
    depends_on:
      - flower-server
    environment: &fl_client_env
      FL_SERVER_ADDRESS: "flower-server:9091"
      FL_DATA_ROOT: "/data"
      FL_LOCAL_EPOCHS: "${FL_LOCAL_EPOCHS:-1}"
      FL_BATCH_SIZE: "${FL_BATCH_SIZE:-16}"
      FL_IMG_SIZE: "${FL_IMG_SIZE:-128}"
      FL_NUM_WORKERS: "0"
      FL_FREEZE_BACKBONE: "${FL_FREEZE_BACKBONE:-1}"
      FL_CLIENT_ID: "client-0"
      FL_PARTITION_FILE: "/partitions/client_0.json"
      FL_ATTACK_CONFIG: "${FL_ATTACK_CONFIG_CLIENT_0:-}"
    volumes: &fl_client_volumes
      - "${DATASET_DIR:-../plantvillage/raw/color}:/data:ro"
      - "${PARTITIONS_DIR:-../docs/experiment_protocol/partitions/pv19-capped/a05/seed-101}:/partitions:ro"
      - "./attack-configs:/attack-configs:ro"
    restart: "no"

  fl-client-1:
    profiles: ["fl5"]
    build:
      context: ../fl-client
    command: ["python", "-m", "app.fl_client"]
    depends_on:
      - flower-server
    environment:
      <<: *fl_client_env
      FL_CLIENT_ID: "client-1"
      FL_PARTITION_FILE: "/partitions/client_1.json"
      FL_ATTACK_CONFIG: "${FL_ATTACK_CONFIG_CLIENT_1:-}"
    volumes: *fl_client_volumes
    restart: "no"

  fl-client-2:
    profiles: ["fl5"]
    build:
      context: ../fl-client
    command: ["python", "-m", "app.fl_client"]
    depends_on:
      - flower-server
    environment:
      <<: *fl_client_env
      FL_CLIENT_ID: "client-2"
      FL_PARTITION_FILE: "/partitions/client_2.json"
      FL_ATTACK_CONFIG: "${FL_ATTACK_CONFIG_CLIENT_2:-}"
    volumes: *fl_client_volumes
    restart: "no"

  fl-client-3:
    profiles: ["fl5"]
    build:
      context: ../fl-client
    command: ["python", "-m", "app.fl_client"]
    depends_on:
      - flower-server
    environment:
      <<: *fl_client_env
      FL_CLIENT_ID: "client-3"
      FL_PARTITION_FILE: "/partitions/client_3.json"
      FL_ATTACK_CONFIG: "${FL_ATTACK_CONFIG_CLIENT_3:-}"
    volumes: *fl_client_volumes
    restart: "no"

  fl-client-4:
    profiles: ["fl5"]
    build:
      context: ../fl-client
    command: ["python", "-m", "app.fl_client"]
    depends_on:
      - flower-server
    environment:
      <<: *fl_client_env
      FL_CLIENT_ID: "client-4"
      FL_PARTITION_FILE: "/partitions/client_4.json"
      FL_ATTACK_CONFIG: "${FL_ATTACK_CONFIG_CLIENT_4:-}"
    volumes: *fl_client_volumes
    restart: "no"
